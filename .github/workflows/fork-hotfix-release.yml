name: Fork hotfix release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Fork branch, tag, or exact commit to build (prefer an exact SHA)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-hotfix-release-${{ github.event.release.id || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'fr4nkastro/openclaw-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      OPENCLAW_TSDOWN_MAX_OLD_SPACE_MB: "6144"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "0"
      OPENCLAW_BUILD_CACHE: "0"
      # Compile external Slack in the same unified host build, not from npm.
      OPENCLAW_INTERNAL_DOCKER_BUILD_PLUGIN_IDS: "slack"
      CI: "true"
    steps:
      - name: Checkout selected fork source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fr4nkastro/openclaw-core
          ref: ${{ github.event_name == 'release' && github.sha || inputs.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Record exact source and toolchain
        env:
          REQUESTED_REF: ${{ github.event.release.tag_name || inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fork-release" "$RUNNER_TEMP/fork-pack"
          corepack enable
          # Corepack reads the full packageManager pin, including its integrity hash.
          corepack install
          node --version
          pnpm --version
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          package = json.loads(pathlib.Path('package.json').read_text())
          sha = output('git', 'rev-parse', 'HEAD')
          if os.environ['GITHUB_EVENT_NAME'] == 'release':
              assert sha == os.environ['EVENT_SHA'], 'Release checkout SHA mismatch'
              assert os.environ['REQUESTED_REF'] == 'v' + package['version'], 'Tag/version mismatch'
          assert output('node', '--version') == 'v24.22.2'
          assert output('pnpm', '--version') == package['packageManager'].split('@', 1)[1].split('+', 1)[0]
          data = dict(repository=os.environ['GITHUB_REPOSITORY'], source_sha=sha,
                      requested_ref=os.environ['REQUESTED_REF'], event=os.environ['GITHUB_EVENT_NAME'],
                      run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                      run_url=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                      workflow_ref=os.environ['WORKFLOW_REF'], workflow_sha=os.environ['WORKFLOW_SHA'],
                      package_name=package['name'], package_version=package['version'],
                      node=output('node', '--version'), package_manager=package['packageManager'],
                      pnpm=output('pnpm', '--version'), runner='ubuntu-24.04',
                      status='not-validated', production_canary='not-run')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fork-release'
          (root / 'provenance.json').write_text(json.dumps(data, indent=2) + '\n')
          (root / 'SOURCE_SHA.txt').write_text(sha + '\n')
          PY

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/fork-release/install.log"

      - name: Verify WAL admission regression and lease safety
        timeout-minutes: 15
        run: |
          set -euo pipefail
          node --test test/scripts/fork-slack-cohort.test.mjs
          pnpm exec vitest run --config test/vitest/vitest.unit-src.config.ts \
            src/plugins/dev-source-root.test.ts \
            src/plugins/fork-slack-cohort.test.ts \
            src/infra/package-plugin-composition.test.ts \
            src/infra/sqlite-wal.admission.test.ts src/infra/sqlite-wal.idle.test.ts \
            src/infra/sqlite-worker-operation-admission.timeout.test.ts \
            src/state/openclaw-state-lease-renewal.worker.test.ts \
            src/plugins/doctor-contract-registry.load-errors.test.ts \
            src/plugins/plugin-native-admission.dangling-host.test.ts \
            src/plugins/plugin-native-namespace.test.ts \
            src/infra/update-recovery-baseline-capture.timing.test.ts \
            src/commands/doctor-original-capture.test.ts \
            2>&1 | tee "$RUNNER_TEMP/fork-release/wal-regression.log"

      - name: Build full package
        run: |
          set -euo pipefail
          pnpm build:package 2>&1 | tee "$RUNNER_TEMP/fork-release/build.log"

      - name: Pack with canonical source packaging lifecycle
        run: |
          set -euo pipefail
          # Plain pnpm pack rejects workspace @openclaw/ai. The owner prepares
          # docs, changelog, manifest, workers and inventory, bundles AI, then
          # invokes pnpm pack; it restores source mutations in finally blocks.
          node --import ./scripts/tsx.mjs scripts/test-built-bundled-channel-entry-smoke.mts
          node scripts/fork-slack-cohort.mjs stage "$PWD" "$(git rev-parse HEAD)"
          node scripts/package-openclaw-for-docker.mjs \
            --skip-build --pnpm-pack --allow-unreleased-changelog \
            --bundle-plugin slack \
            --output-dir "$RUNNER_TEMP/fork-pack" \
            2>&1 | tee "$RUNNER_TEMP/fork-release/pack.log"

      - name: Validate archive identity and prepared contents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          proof = json.loads((root / 'fork-release/provenance.json').read_text())
          files = list((root / 'fork-pack').glob('openclaw-*.tgz'))
          assert len(files) == 1, 'Expected exactly one OpenClaw tarball'
          archive = files[0]
          assert proof['package_name'] == 'openclaw'
          assert archive.name == f"openclaw-{proof['package_version']}.tgz", 'Unexpected tarball name'
          with tarfile.open(archive) as tar:
              names = set(tar.getnames())
              manifest = json.load(tar.extractfile('package/package.json'))
              assert manifest['name'] == proof['package_name']
              assert manifest['version'] == proof['package_version']
              build = json.load(tar.extractfile('package/dist/build-info.json'))
              assert build['commit'] == proof['source_sha']
              assert build['stagedOfficialPlugins'] == dict(commit=proof['source_sha'], pluginIds=['slack'])
              slack = json.load(tar.extractfile('package/dist/extensions/slack/package.json'))
              assert slack['name'] == '@openclaw/slack'
              assert slack['openclaw']['build']['bundledDist'] is True
              assert '!dist/extensions/slack/**' not in manifest.get('files', [])
              assert 'package/dist/extensions/slack/runtime-api.js' in names
              for name in ['package/openclaw.mjs', 'package/dist/index.js',
                           'package/dist/control-ui/index.html', 'package/docs/docs_map.md',
                           'package/node_modules/@openclaw/ai/package.json']:
                  assert name in names, f'Missing prepared content: {name}'
              assert any(n.startswith('package/dist/worker-artifacts/') and n.endswith('.tar.gz') for n in names)
              assert not any(str(v).startswith('workspace:') for v in manifest.get('dependencies', {}).values())
          proof['tarball'] = archive.name
          proof['sha256'] = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          (root / 'fork-release/provenance.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY

      - name: Isolated npm install and CLI smoke
        timeout-minutes: 25
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/fork-smoke"
          mkdir -p "$smoke/home" "$smoke/state" "$smoke/prefix" "$smoke/work"
          export HOME="$smoke/home" OPENCLAW_STATE_DIR="$smoke/state"
          export OPENCLAW_CONFIG_PATH="$smoke/state/openclaw.json"
          export npm_config_cache="$smoke/npm-cache" npm_config_userconfig="$smoke/npmrc"
          export XDG_CONFIG_HOME="$smoke/home/.config" XDG_CACHE_HOME="$smoke/home/.cache"
          touch "$npm_config_userconfig"
          archive=("$RUNNER_TEMP"/fork-pack/openclaw-*.tgz)
          source_root="$PWD"
          source_sha="$(git rev-parse HEAD)"
          cd "$smoke/work"
          # Keep install lifecycle scripts: this exercises the actual consumer path.
          npm install --global --prefix "$smoke/prefix" --no-audit --no-fund "${archive[0]}" \
            2>&1 | tee "$RUNNER_TEMP/fork-release/smoke-install.log"
          timeout 120 "$smoke/prefix/bin/openclaw" --version \
            | tee "$RUNNER_TEMP/fork-release/cli-version.txt"
          timeout 120 "$smoke/prefix/bin/openclaw" --help \
            > "$RUNNER_TEMP/fork-release/cli-help.txt"
          # Import runtime-api, including the lazy monitor graph, from the installed
          # artifact on plain Node; never start a channel or use real credentials.
          timeout 120 node "$source_root/scripts/fork-slack-cohort.mjs" smoke \
            "$smoke/prefix/lib/node_modules/openclaw" "$source_sha" \
            > "$RUNNER_TEMP/fork-release/slack-cohort.json"
          timeout 120 "$smoke/prefix/bin/openclaw" plugins list --json \
            > "$RUNNER_TEMP/fork-release/plugins-list.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fork-release'
          proof = json.loads((root / 'provenance.json').read_text())
          assert proof['package_version'] in (root / 'cli-version.txt').read_text()
          assert 'Usage:' in (root / 'cli-help.txt').read_text()
          proof['slack_cohort'] = json.loads((root / 'slack-cohort.json').read_text())
          assert proof['slack_cohort']['source_sha'] == proof['source_sha']
          plugins = json.loads((root / 'plugins-list.json').read_text())['plugins']
          selected = [p for p in plugins if p['id'] == 'slack']
          assert len(selected) == 1, 'Slack must be discovered exactly once'
          assert selected[0]['origin'] == 'bundled', 'Slack resolved to an external generation'
          expected = pathlib.Path(os.environ['RUNNER_TEMP']) / 'fork-smoke/prefix/lib/node_modules/openclaw/dist/extensions/slack'
          assert pathlib.Path(selected[0]['rootDir']).resolve() == expected.resolve()
          proof['slack_cohort']['discovery_selection'] = 'bundled-installed-artifact'
          proof['status'] = 'package-and-cli-smoke-passed'
          (root / 'provenance.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
          cp "${archive[0]}" "$RUNNER_TEMP/fork-release/"
          cd "$RUNNER_TEMP/fork-release"
          sha256sum openclaw-*.tgz provenance.json SOURCE_SHA.txt slack-cohort.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Retain package and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-hotfix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-release/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  release-assets:
    needs: build
    if: github.repository == 'fr4nkastro/openclaw-core' && github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      # No source checkout or package execution in this write-token job.
      - name: Download this run's validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-hotfix-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Upload immutable assets and read back exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fr4nkastro/openclaw-core
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os, pathlib
          p = json.loads(pathlib.Path('provenance.json').read_text())
          assert p['status'] == 'package-and-cli-smoke-passed'
          assert p['slack_cohort']['source_sha'] == p['source_sha']
          assert p['slack_cohort']['runtime_import'] == 'passed'
          assert p['slack_cohort']['discovery_selection'] == 'bundled-installed-artifact'
          assert p['slack_cohort']['official_registry_provenance'] is False
          assert p['source_sha'] == os.environ['SOURCE_SHA']
          assert p['repository'] == os.environ['GH_REPO']
          assert p['run_id'] == os.environ['GITHUB_RUN_ID']
          assert p['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert os.environ['RELEASE_TAG'] == 'v' + p['package_version']
          PY
          test "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .id)" = "$RELEASE_ID"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          # Deliberately no --clobber: reruns must not silently replace release bytes.
          gh release upload "$RELEASE_TAG" openclaw-*.tgz SHA256SUMS provenance.json SOURCE_SHA.txt slack-cohort.json
          mkdir "$RUNNER_TEMP/fork-release-readback"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/fork-release-readback" \
            --pattern 'openclaw-*.tgz' --pattern SHA256SUMS --pattern provenance.json --pattern SOURCE_SHA.txt --pattern slack-cohort.json
          cmp SHA256SUMS "$RUNNER_TEMP/fork-release-readback/SHA256SUMS"
          cd "$RUNNER_TEMP/fork-release-readback"
          sha256sum --check SHA256SUMS
